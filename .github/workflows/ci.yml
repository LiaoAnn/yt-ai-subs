# Type check, lint, format check, unit tests and build on every pull request and on main.
# A pull request is merged only after this passes (AGENTS.md, Development workflow).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is not enabled yet; corepack provides it in the next step.
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
